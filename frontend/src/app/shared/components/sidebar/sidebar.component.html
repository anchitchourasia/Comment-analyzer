<nav class="sidebar glass-card" aria-label="Main Navigation">
  <div class="nav-section">
    <div class="section-title">NAVIGATION</div>

    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <span class="nav-icon" aria-hidden="true">🎛️</span>
      <span class="nav-label">Dashboard</span>
    </a>

    <a routerLink="/live-qa" routerLinkActive="active" class="nav-item">
      <span class="nav-icon" aria-hidden="true">⚡</span>
      <span class="nav-label">Live Q&A Queue</span>
      @if (pendingCount() > 0) {
        <span class="badge-count" [attr.aria-label]="pendingCount() + ' pending questions'">{{ pendingCount() }}</span>
      }
    </a>

    <a routerLink="/qa-library" routerLinkActive="active" class="nav-item">
      <span class="nav-icon" aria-hidden="true">🧠</span>
      <span class="nav-label">Q&A Memory</span>
    </a>

    <a routerLink="/analytics" routerLinkActive="active" class="nav-item">
      <span class="nav-icon" aria-hidden="true">📊</span>
      <span class="nav-label">Comment Analytics</span>
    </a>

    <a routerLink="/settings" routerLinkActive="active" class="nav-item">
      <span class="nav-icon" aria-hidden="true">⚙️</span>
      <span class="nav-label">Settings</span>
    </a>
  </div>

  <div class="sidebar-footer glass-card">
    <div class="footer-status-row">
      <span class="status-indicator-dot" [class.connected]="auth.hasChannelSelected()"></span>
      <span class="footer-title">{{ auth.hasChannelSelected() ? 'Channel Connected' : 'No Channel Selected' }}</span>
    </div>
    <div class="footer-text">{{ auth.user()?.selected_channel_title || 'Connect via Settings' }}</div>
  </div>
</nav>
