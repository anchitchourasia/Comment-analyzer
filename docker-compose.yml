version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comment_analyzer
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WEB_CONCURRENCY=1
    env_file:
      - .env
    volumes:
      - ./data:/app/data
